name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Verify MkDocs output
        run: |
          test -f site/index.html
          grep -q "Elysia E-Commerce" site/index.html

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --message "Deploy docs from ${GITHUB_SHA::7}"

      # Pushes made with GITHUB_TOKEN do not trigger a Pages build, so the
      # deploy above would otherwise leave the live site stale.
      - name: Verify Pages source and trigger a build
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fix =
              `gh api -X PUT repos/${owner}/${repo}/pages ` +
              `-f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'`;

            let site;
            try {
              ({ data: site } = await github.rest.repos.getPages({ owner, repo }));
            } catch (error) {
              core.setFailed(
                `GitHub Pages is not enabled (${error.message}). ` +
                  'Enable it under Settings -> Pages -> Deploy from a branch -> gh-pages -> / (root).'
              );
              return;
            }

            const source = site.source
              ? `${site.source.branch}${site.source.path}`
              : site.build_type;

            if (
              !site.source ||
              site.source.branch !== 'gh-pages' ||
              site.source.path !== '/'
            ) {
              core.setFailed(
                `GitHub Pages is serving "${source}", so the MkDocs site on gh-pages is ignored. ` +
                  `Run: ${fix}`
              );
              return;
            }

            const { data: build } = await github.rest.repos.requestPagesBuild({ owner, repo });
            core.info(`Requested a GitHub Pages build (${build.status}).`);
